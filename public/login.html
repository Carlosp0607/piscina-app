<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaGest - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0077b6; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: white; padding: 40px; border-radius: 15px; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h1 { text-align: center; color: #0077b6; margin-bottom: 10px; font-size: 24px; }
    p { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 20px; }
    button { width: 100%; background: #0077b6; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #005f8e; }
    .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🏊 AquaGest</h1>
    <p>Sistema de Gestión de Piscina</p>
    <div class="error" id="error">Usuario o contraseña incorrectos</div>
    <label>Usuario</label>
    <input type="text" id="usuario" placeholder="Ej: admin">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">
    <button onclick="login()">Ingresar</button>
  </div>

  <script>
    async function login() {
      const usuario = document.getElementById('usuario').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      });

      const data = await res.json();

      if (res.ok) {
        if (data.rol === 'admin') {
          window.location.href = '/index.html';
        } else {
          window.location.href = '/portero.html';
        }
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }

    // Permitir login con Enter
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
