<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaGest - Portero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; }
    header { background: #0077b6; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 22px; }
    .btn-logout { background: transparent; color: white; border: 2px solid white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
    .container { max-width: 700px; margin: 30px auto; padding: 0 20px; }
    .card { background: white; border-radius: 10px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #0077b6; margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 15px; }
    button { background: #0077b6; color: white; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 5px; }
    button:hover { background: #005f8e; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0077b6; color: white; padding: 10px; text-align: left; font-size: 13px; }
    td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
    tr:hover { background: #f9f9f9; }
    .btn-salida { background: #fd7e14; color: white; padding: 6px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; margin-top: 0; }
    .alerta { padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; text-align: center; font-weight: bold; }
    .alerta-ok { background: #d4edda; color: #155724; }
    .alerta-error { background: #f8d7da; color: #721c24; }
    .miembro-info { background: #e8f4fd; border: 2px solid #0077b6; border-radius: 10px; padding: 20px; margin-bottom: 15px; display: none; }
    .miembro-info h3 { color: #0077b6; margin-bottom: 10px; }
    .miembro-info p { font-size: 14px; margin-bottom: 5px; }
  </style>
</head>
<body>
  <header>
    <h1>🏊 AquaGest - Control de Acceso</h1>
    <span id="reloj" style="font-size: 14px;"></span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </header>

  <div class="container">
    <div class="card">
      <h2>Registrar Entrada</h2>
      <div class="alerta alerta-ok" id="alerta-ok"></div>
      <div class="alerta alerta-error" id="alerta-error"></div>

      <label>Buscar por documento o nombre</label>
      <input type="text" id="busqueda" placeholder="Ej: 1050332855" onkeyup="buscarMiembro()">

      <div class="miembro-info" id="miembro-info">
        <h3 id="info-nombre"></h3>
        <p><strong>Documento:</strong> <span id="info-documento"></span></p>
        <p><strong>Plan:</strong> <span id="info-plan"></span></p>
        <p><strong>Vence:</strong> <span id="info-vencimiento"></span></p>
        <p><strong>Estado:</strong> <span id="info-estado"></span></p>
        <button onclick="registrarEntrada()">✅ Registrar Entrada</button>
      </div>
    </div>

    <div class="card">
      <h2>Asistencia de Hoy</h2>
      <table>
        <thead>
          <tr><th>Miembro</th><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Acción</th></tr>        </thead>
        <tbody id="tablaAsistencia"></tbody>
      </table>
    </div>
  </div>

  <script>
    let miembroSeleccionado = null;
    let todosMiembros = [];

    async function verificarSesion() {
      const res = await fetch('/api/auth/session');
      if (!res.ok) {
        window.location.href = '/login.html';
        return;
      }
      const data = await res.json();
      if (data.rol !== 'portero') {
        window.location.href = '/login.html';
      }
    }

    async function cargarMiembros() {
      const res = await fetch('/api/miembros');
      todosMiembros = await res.json();
    }

    function buscarMiembro() {
      const texto = document.getElementById('busqueda').value.toLowerCase();
      if (texto.length < 2) {
        document.getElementById('miembro-info').style.display = 'none';
        return;
      }
      const encontrado = todosMiembros.find(m =>
        m.documento.toLowerCase().includes(texto) ||
        m.nombre.toLowerCase().includes(texto)
      );
      if (encontrado) {
        miembroSeleccionado = encontrado;
        document.getElementById('info-nombre').textContent = encontrado.nombre;
        document.getElementById('info-documento').textContent = encontrado.documento;
        document.getElementById('info-plan').textContent = encontrado.plan;
        document.getElementById('info-vencimiento').textContent = encontrado.fecha_vencimiento.split('T')[0];
        document.getElementById('info-estado').textContent = encontrado.estado;
        document.getElementById('miembro-info').style.display = 'block';
      } else {
        document.getElementById('miembro-info').style.display = 'none';
        miembroSeleccionado = null;
      }
    }

    async function registrarEntrada() {
      if (!miembroSeleccionado) return;
      if (miembroSeleccionado.estado !== 'activo') {
        mostrarAlerta('error', '❌ Este miembro no tiene membresía activa');
        return;
      }
      await fetch('/api/asistencia/entrada', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ miembro_id: miembroSeleccionado.id })
      });
      mostrarAlerta('ok', `✅ Entrada registrada para ${miembroSeleccionado.nombre}`);
      document.getElementById('busqueda').value = '';
      document.getElementById('miembro-info').style.display = 'none';
      miembroSeleccionado = null;
      cargarAsistenciaHoy();
    }

    async function registrarSalida(id) {
      await fetch(`/api/asistencia/${id}/salida`, { method: 'PATCH' });
      cargarAsistenciaHoy();
    }

    async function cargarAsistenciaHoy() {
      const res = await fetch('/api/asistencia/hoy');
      const lista = await res.json();
      const tbody = document.getElementById('tablaAsistencia');
     tbody.innerHTML = lista.map(a => `
        <tr>
          <td>${a.nombre}</td>
          <td>${new Date(a.fecha).toLocaleDateString('es-CO')}</td>
          <td>${a.hora_entrada ? a.hora_entrada.slice(0,5) : '---'}</td>
<td>${a.hora_salida ? a.hora_salida.slice(0,5) : ''}</td>
<td>${!a.hora_salida ? `<button class="btn-salida" onclick="registrarSalida(${a.id})">🚪 Salida</button>` : '✅ Completado'}</td>
        </tr>
      `).join('');
    }

    function mostrarAlerta(tipo, mensaje) {
      const ok = document.getElementById('alerta-ok');
      const err = document.getElementById('alerta-error');
      ok.style.display = 'none';
      err.style.display = 'none';
      if (tipo === 'ok') { ok.textContent = mensaje; ok.style.display = 'block'; }
      else { err.textContent = mensaje; err.style.display = 'block'; }
      setTimeout(() => { ok.style.display = 'none'; err.style.display = 'none'; }, 3000);
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    verificarSesion();
    cargarMiembros();
    cargarAsistenciaHoy();

    function actualizarReloj() {
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const hora = ahora.toLocaleTimeString('es-CO');
  document.getElementById('reloj').textContent = `📅 ${fecha} — ⏰ ${hora}`;
}
actualizarReloj();
setInterval(actualizarReloj, 1000);
  </script>
</body>
</html>
